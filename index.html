<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neo-Shibuya Rain · Cyber City v7</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070a10; font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif; }
  #scene { position: fixed; inset: 0; display: block; touch-action: none; }

  .ui { position: fixed; z-index: 10; color: rgba(220,230,240,0.85); user-select: none; -webkit-user-select: none; }

  #topBar { position: fixed; z-index: 10; top: 16px; left: 16px; right: 16px; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; pointer-events: none; }
  #topBar > * { pointer-events: auto; position: relative; }

  #langPanel { }
  #langBtn { background: rgba(10,15,25,0.55); border: 1px solid rgba(140,170,200,0.25); border-radius: 24px; padding: 8px 16px; color: rgba(230,240,250,0.9); font-size: 13px; cursor: pointer; backdrop-filter: blur(8px); transition: border-color .2s; }
  #langBtn:hover { border-color: rgba(170,200,230,0.6); }
  #langMenu { position: absolute; margin-top: 6px; background: rgba(10,15,25,0.75); border: 1px solid rgba(140,170,200,0.2); border-radius: 12px; padding: 4px; display: none; backdrop-filter: blur(10px); z-index: 20; }
  #langMenu .lang-item { padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; color: rgba(220,230,240,0.85); transition: background .15s; }
  #langMenu .lang-item:hover { background: rgba(120,150,190,0.25); }
  #langMenu .lang-item.active { color: #9fc4ff; }

  #dictBtn { background: rgba(10,15,25,0.55); border: 1px solid rgba(140,170,200,0.25); border-radius: 24px; padding: 8px 16px; color: rgba(230,240,250,0.9); font-size: 13px; cursor: pointer; backdrop-filter: blur(8px); transition: border-color .2s; }
  #dictBtn:hover { border-color: rgba(170,200,230,0.6); }
  #dictBtn.open { border-color: #9fc4ff; color: #9fc4ff; }

  #searchPanel { margin-left: auto; width: 300px; }
  #searchPanel .box { display: flex; align-items: center; background: rgba(10,15,25,0.55); border: 1px solid rgba(140,170,200,0.25); border-radius: 24px; padding: 4px 6px 4px 16px; backdrop-filter: blur(8px); transition: border-color .2s; }
  #searchPanel .box:focus-within { border-color: rgba(170,200,230,0.6); }
  #searchInput { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: rgba(230,240,250,0.95); font-size: 14px; letter-spacing: 1px; }
  #searchInput::placeholder { color: rgba(180,195,215,0.45); }
  #searchBtn { background: linear-gradient(135deg, rgba(90,120,170,0.7), rgba(120,90,160,0.7)); border: none; color: #fff; border-radius: 20px; padding: 7px 16px; font-size: 13px; cursor: pointer; transition: filter .2s; white-space: nowrap; }
  #searchBtn:hover { filter: brightness(1.2); }
  #searchBtn:disabled { opacity: .5; cursor: wait; }
  #historyWrap { margin-top: 8px; max-height: 180px; overflow-y: auto; background: rgba(10,15,25,0.6); border: 1px solid rgba(140,170,200,0.15); border-radius: 12px; padding: 4px; backdrop-filter: blur(8px); display: none; }
  #historyHead { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; font-size: 11px; color: rgba(170,185,205,0.6); letter-spacing: 1px; }
  #historyClear { background: transparent; border: none; color: rgba(160,190,225,0.7); font-size: 11px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  #historyClear:hover { background: rgba(120,150,190,0.2); color: #fff; }
  #historyList { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 6px 8px; }
  .h-item { display: flex; align-items: center; gap: 6px; background: rgba(90,130,190,0.18); border: 1px solid rgba(140,180,225,0.25); border-radius: 14px; padding: 3px 8px 3px 10px; cursor: pointer; font-size: 12px; color: rgba(215,230,245,0.9); transition: background .15s; }
  .h-item:hover { background: rgba(110,150,210,0.32); }
  .h-item .h-del { color: rgba(170,185,210,0.55); font-size: 11px; padding: 0 2px; border-radius: 50%; }
  .h-item .h-del:hover { color: #ff8080; background: rgba(255,80,80,0.15); }
  #resultList { margin-top: 8px; max-height: 240px; overflow-y: auto; background: rgba(10,15,25,0.6); border: 1px solid rgba(140,170,200,0.15); border-radius: 12px; padding: 4px; backdrop-filter: blur(8px); display: none; }
  #resultList .item { padding: 8px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background .15s; }
  #resultList .item:hover { background: rgba(120,150,190,0.2); }
  #resultList .item .t { font-size: 13px; color: rgba(230,240,250,0.9); }
  #resultList .item .a { font-size: 11px; color: rgba(170,185,205,0.6); }
  #resultList .empty { padding: 12px; font-size: 13px; color: rgba(180,195,215,0.6); }

  #favListBtn { background: rgba(10,15,25,0.55); border: 1px solid rgba(140,170,200,0.25); border-radius: 24px; padding: 8px 14px; color: rgba(255,210,215,0.9); font-size: 13px; cursor: pointer; backdrop-filter: blur(8px); transition: border-color .2s; }
  #favListBtn:hover { border-color: rgba(255,160,170,0.6); }
  #favPanel { position: fixed; top: 64px; right: 16px; width: 340px; max-width: calc(100% - 32px); max-height: min(480px, 60vh); background: rgba(10,15,25,0.82); border: 1px solid rgba(200,140,160,0.3); border-radius: 16px; backdrop-filter: blur(12px); z-index: 30; display: none; flex-direction: column; overflow: hidden; }
  #favPanel.open { display: flex; }
  .fav-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; font-size: 14px; color: rgba(255,215,225,0.95); }
  #favClose { background: transparent; border: none; color: rgba(200,170,180,0.7); font-size: 15px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  #favClose:hover { color: #fff; background: rgba(255,80,80,0.2); }
  #favList { overflow-y: auto; padding: 4px 10px 12px; }
  #favList .f-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; transition: background .15s; }
  #favList .f-item:hover { background: rgba(180,110,130,0.15); }
  #favList .f-item .t { flex: 1; min-width: 0; font-size: 13px; color: rgba(235,225,232,0.92); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #favList .f-item .a { font-size: 11px; color: rgba(190,165,175,0.6); }
  #favList .f-item .f-del { color: rgba(200,160,170,0.6); font-size: 13px; padding: 2px 6px; border-radius: 6px; }
  #favList .f-item .f-del:hover { color: #ff8080; background: rgba(255,80,80,0.15); }
  #favList .empty { padding: 16px; text-align: center; font-size: 13px; color: rgba(180,195,215,0.55); }
  #favBtn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,170,185,0.4); cursor: pointer; background: rgba(180,90,110,0.2); color: #ff9fb0; font-size: 16px; flex-shrink: 0; transition: all .2s; }
  #favBtn:hover { background: rgba(180,90,110,0.4); }
  #favBtn.on { background: rgba(220,90,120,0.45); border-color: rgba(255,150,170,0.7); color: #ffb3c0; box-shadow: 0 0 12px rgba(255,120,150,0.5); }

  /* ---- 词典面板 ---- */
  #dictPanel { position: fixed; top: 64px; right: 16px; width: 360px; max-width: calc(100% - 32px); max-height: min(560px, 68vh); background: rgba(10,15,25,0.82); border: 1px solid rgba(140,170,200,0.25); border-radius: 16px; backdrop-filter: blur(12px); z-index: 30; display: none; flex-direction: column; overflow: hidden; }
  #dictPanel.open { display: flex; }
  .dict-head { display: flex; align-items: center; padding: 10px 12px 6px; gap: 6px; }
  .dict-tab { padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(140,170,200,0.3); background: transparent; color: rgba(200,215,235,0.75); font-size: 13px; cursor: pointer; transition: all .15s; }
  .dict-tab.active { background: rgba(90,130,180,0.35); border-color: rgba(160,195,235,0.6); color: #fff; }
  .dict-search-row { display: flex; gap: 6px; padding: 6px 12px 8px; }
  .dict-search-row input { flex: 1; min-width: 0; background: rgba(20,28,42,0.7); border: 1px solid rgba(140,170,200,0.3); border-radius: 12px; padding: 8px 12px; color: rgba(230,240,250,0.95); font-size: 14px; outline: none; }
  .dict-search-row input:focus { border-color: rgba(160,195,235,0.7); }
  .dict-search-row button { background: rgba(90,130,180,0.5); border: none; border-radius: 12px; padding: 8px 14px; color: #fff; font-size: 13px; cursor: pointer; }
  .dict-search-row button:hover { filter: brightness(1.15); }
  .dict-body { overflow-y: auto; padding: 4px 14px 14px; font-size: 13px; line-height: 1.75; }
  .dict-body .word-big { font-size: 34px; font-weight: 700; color: rgba(240,246,255,0.98); margin-bottom: 2px; }
  .dict-body .word-phon { color: rgba(160,190,225,0.95); font-size: 15px; margin-bottom: 6px; }
  .dict-body .word-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .dict-body .badge { background: rgba(90,130,180,0.25); border: 1px solid rgba(140,180,225,0.3); border-radius: 8px; padding: 2px 9px; font-size: 12px; color: rgba(190,215,245,0.95); }
  .dict-body .pos { color: #9fc4ff; font-style: italic; margin-top: 8px; font-size: 12px; }
  .dict-body .def { color: rgba(225,235,248,0.92); margin: 2px 0 4px 8px; }
  .dict-body .ex { color: rgba(170,185,210,0.62); margin-left: 14px; font-size: 12px; }
  .dict-body .zhi { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .dict-body .zhi .badge { font-size: 13px; }
  .dict-body .zh-def { margin-bottom: 4px; }
  .dict-body .not-found { color: rgba(180,195,215,0.6); padding: 10px 0; }

  #nowPlaying { left: 50%; transform: translateX(-50%); bottom: 26px; display: flex; align-items: center; gap: 12px; background: rgba(10,15,25,0.6); border: 1px solid rgba(140,170,200,0.2); border-radius: 28px; padding: 8px 18px; backdrop-filter: blur(8px); max-width: 70%; }
  #nowPlaying .info { display: flex; flex-direction: column; min-width: 0; }
  #nowPlaying .title { font-size: 14px; color: rgba(230,240,250,0.95); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #nowPlaying .artist { font-size: 11px; color: rgba(170,185,205,0.65); }
  #playPause { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(170,200,230,0.4); cursor: pointer; background: rgba(90,130,180,0.25); color: #fff; font-size: 14px; flex-shrink: 0; transition: background .2s; }
  #playPause:hover { background: rgba(90,130,180,0.45); }

  #rainPanel { right: 20px; bottom: 26px; text-align: center; }
  #rainPanel label { display: block; font-size: 12px; letter-spacing: 2px; color: rgba(180,195,215,0.7); margin-bottom: 6px; }
  #rainSlider { -webkit-appearance: none; appearance: none; width: 170px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, rgba(80,120,180,0.7), rgba(130,100,180,0.7)); outline: none; cursor: pointer; }
  #rainSlider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #dce8f5, #7fa0c8); box-shadow: 0 0 12px rgba(140,180,230,0.6); cursor: pointer; }
  #rainSlider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; border: none; background: radial-gradient(circle at 35% 35%, #dce8f5, #7fa0c8); box-shadow: 0 0 12px rgba(140,180,230,0.6); cursor: pointer; }
  #rainValue { display: block; margin-top: 6px; font-size: 12px; color: rgba(180,195,215,0.7); }

  #weatherPanel { position: fixed; left: 50%; transform: translateX(-50%); bottom: 26px; display: flex; gap: 8px; background: rgba(10,15,25,0.55); border: 1px solid rgba(140,170,200,0.18); border-radius: 24px; padding: 7px 12px; backdrop-filter: blur(8px); z-index: 20; }
  #weatherPanel .wbtn { border: 1px solid rgba(140,170,200,0.25); background: rgba(70,100,150,0.2); color: rgba(215,230,245,0.85); font-size: 13px; border-radius: 16px; padding: 4px 10px; cursor: pointer; transition: all .25s; white-space: nowrap; }
  #weatherPanel .wbtn:hover { background: rgba(90,130,190,0.4); }
  #weatherPanel .wbtn.active { background: linear-gradient(135deg, rgba(90,140,220,0.65), rgba(140,90,220,0.55)); border-color: rgba(170,200,255,0.6); color: #fff; box-shadow: 0 0 14px rgba(120,160,255,0.45); }
  #weatherPanel .wbtn .wicon { font-size: 15px; margin-right: 2px; }
  #weatherPanel .wbtn .wlabel { font-size: 11px; }

  #hint { left: 20px; bottom: 26px; font-size: 12px; color: rgba(160,175,195,0.5); line-height: 1.8; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(140,170,200,0.3); border-radius: 3px; }

  @media (max-width: 820px) {
    #topBar { top: 10px; left: 10px; right: 10px; }
    #searchPanel { width: 100%; }
    #searchPanel .box { width: 100%; }
    #dictPanel { top: 100px; right: 10px; width: calc(100% - 20px); max-height: 60vh; }
    #favPanel { top: 100px; right: 10px; width: calc(100% - 20px); max-height: 55vh; }
    #rainPanel { right: 12px; bottom: 84px; }
    #rainSlider { width: 130px; }
    #weatherPanel { bottom: 70px; max-width: calc(100% - 24px); overflow-x: auto; }
    #weatherPanel .wbtn { padding: 3px 7px; font-size: 12px; }
    #nowPlaying { bottom: 16px; max-width: calc(100% - 24px); padding: 6px 14px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="topBar">
    <div id="langPanel">
      <button id="langBtn">🌐 English</button>
      <div id="langMenu">
        <div class="lang-item" data-lang="en">English</div>
        <div class="lang-item" data-lang="zh">中文</div>
        <div class="lang-item" data-lang="ja">日本語</div>
        <div class="lang-item" data-lang="ko">한국어</div>
      </div>
    </div>
    <button id="dictBtn">📖 Dictionary</button>
    <button id="favListBtn">❤️ 0</button>
    <div id="searchPanel">
      <div class="box">
        <input id="searchInput" type="text" placeholder="Search for a song…" />
        <button id="searchBtn">Search</button>
      </div>
      <div id="historyWrap">
        <div id="historyHead"><span id="historyTitle">History</span><button id="historyClear">Clear</button></div>
        <div id="historyList"></div>
      </div>
      <div id="resultList"></div>
    </div>
  </div>

  <div id="dictPanel">
    <div class="dict-head">
      <button class="dict-tab active" data-dict="en">EN · Oxford</button>
      <button class="dict-tab" data-dict="zh">中文 · 汉语字典</button>

    <div class="dict-search-row">
      <input id="dictInput" type="text" placeholder="Type a word / 输入汉字…" />
      <button id="dictGo">🔍</button>
    </div>
    <div class="dict-body" id="dictBody"></div>
  </div>

  <div id="nowPlaying" class="ui" style="display:none;">
    <button id="playPause">⏸</button>
    <div class="info">
      <span class="title" id="npTitle">-</span>
      <span class="artist" id="npArtist">-</span>
    </div>
    <button id="favBtn" title="Favorite">♡</button>
  </div>

  <div id="favPanel">
    <div class="fav-head">
      <span id="favTitle">❤️ Favorites</span>
      <button id="favClose">✕</button>
    </div>
    <div id="favList"></div>
  </div>

  <div id="rainPanel" class="ui">
    <label id="rainLabel">RAIN</label>
    <input id="rainSlider" type="range" min="0" max="200" value="90" />
    <span id="rainValue">90%</span>
  </div>

  <div id="weatherPanel" class="ui">
    <button class="wbtn" data-weather="clear"><span class="wicon">🌙</span><span class="wlabel">CLEAR</span></button>
    <button class="wbtn" data-weather="drizzle"><span class="wicon">🌫️</span><span class="wlabel">DRIZZLE</span></button>
    <button class="wbtn" data-weather="light"><span class="wicon">🌦️</span><span class="wlabel">LIGHT</span></button>
    <button class="wbtn active" data-weather="rain"><span class="wicon">🌧️</span><span class="wlabel">RAIN</span></button>
    <button class="wbtn" data-weather="storm"><span class="wicon">⛈️</span><span class="wlabel">STORM</span></button>
    <button class="wbtn" data-weather="thunder"><span class="wicon">🌩️</span><span class="wlabel">THUNDER</span></button>
    <button class="wbtn" data-weather="snow"><span class="wicon">❄️</span><span class="wlabel">SNOW</span></button>
    <button class="wbtn" data-weather="fog"><span class="wicon">🌁</span><span class="wlabel">FOG</span></button>
    <button class="wbtn" data-weather="typhoon"><span class="wicon">🌀</span><span class="wlabel">TYPHOON</span></button>
  </div>

  <div id="hint" class="ui">
    <span id="hint1">🖱 Drag to rotate · Scroll to zoom</span><br/>
    <span id="hint2">🎵 Search songs in the top right</span><br/>
    <span id="hint3">👆 Click to enable rain &amp; wind sound</span>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>

  // ---- 屋顶广告牌 ----

      new THREE.MeshStandardMaterial({ color: 0x222a35, roughness: 0.6, metalness: 0.4 }));

  // ---- 便利店（红白条纹 + 大玻璃窗） ----
  function makeConvenience(x, z, rotY) {
    const g = new THREE.Group();
    const w = 7 + Math.random() * 2, d = 4.5, h = 3.1;
    const body = new THREE.Mesh(new THREE.BoxGeometry(d, h, w), darkMat.clone());
    body.position.y = h / 2; g.add(body);
    // 红白横条纹招牌
    const c = document.createElement('canvas');
    c.width = 256; c.height = 48;
    const ctx = c.getContext('2d');
    for (let i = 0; i < 16; i++) {
      ctx.fillStyle = i % 2 ? '#e64040' : '#f0f0f0';
      ctx.fillRect(i * 16, 0, 16, 48);
    }
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('CVS', 128, 26);
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.9, 1.1),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
    sign.position.set(0, 2.75, d / 2 + 0.05); g.add(sign);
    // 玻璃窗
    const win = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.9, 1.6),
      new THREE.MeshBasicMaterial({ color: 0xfff0d0, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false }));

  // ---- 公寓楼（阳台 + 暖窗） ----
  function makeApartment(x, z, rotY) {
    const g = new THREE.Group();
    const w = 6 + Math.random() * 3, d = 5 + Math.random() * 2, floors = 2 + (Math.random() * 3 | 0);
    const h = floors * 3 + 0.5;
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({ color: 0x1d2129, roughness: 0.85 }));
    body.position.y = h / 2; g.add(body);
    // 阳台（一侧一排小盒子）
    for (let j = 1; j <= floors; j++) {
      for (let k = 0; k < 3; k++) {
        const bal = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.12, 0.7),
          new THREE.MeshStandardMaterial({ color: 0x4a5563, roughness: 0.6, metalness: 0.4 }));
        bal.position.set(-w * 0.35 + k * 0.9, j * 3 - 0.15, d / 2 + 0.2);
        g.add(bal);
        // 暖窗光
        if (Math.random() < 0.7) {
          const win = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.95),
            new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false }));
          win.position.set(-w * 0.35 + k * 0.9, j * 3 - 0.4, d / 2 + 0.18);
          g.add(win);
        }

    }
    // 楼顶水箱
    if (Math.random() < 0.6) {

      tank.position.set(0, h + 0.6, 0); g.add(tank);

    // 建模优化：屋顶太阳能板（一半概率）

        panel.position.set(-w * 0.3 + p * 0.9, h + 0.22, 0.4);
        panel.rotation.z = 0.35; // 略倾斜
        g.add(panel);
        // 太阳能板反光条
        const glint = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.35),
          new THREE.MeshBasicMaterial({ color: 0x9fc4ff, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false }));
        glint.position.set(-w * 0.3 + p * 0.9, h + 0.3, 0.4);
        glint.rotation.x = -0.35;

    }
    // 建模优化：屋顶设备间（空调机组）
    if (Math.random() < 0.35) {
      const unit = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.5, 0.8), new THREE.MeshStandardMaterial({ color: 0x3a4656, roughness: 0.6 }));
      unit.position.set(w * 0.25, h + 0.26, -d * 0.25); g.add(unit);
      const fan = new THREE.Mesh(new THREE.CircleGeometry(0.2, 8),

      fan.position.set(w * 0.25, h + 0.51, -d * 0.25 + 0.41); g.add(fan);
    }
    // 建模优化：墙面空调外机（每层随机挂）
    for (let j = 1; j <= floors; j++) {
      if (Math.random() < 0.4) {
        const ac = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.5, 0.22),
          new THREE.MeshStandardMaterial({ color: 0x4a5563, roughness: 0.5, metalness: 0.3 }));
        ac.position.set(w * 0.42, j * 3 - 1.1, d / 2 + 0.14);
        g.add(ac);
        const acFan = new THREE.Mesh(new THREE.CircleGeometry(0.14, 8),
          new THREE.MeshBasicMaterial({ color: 0x20262e }));
        acFan.position.set(w * 0.42, j * 3 - 1.1, d / 2 + 0.25);
        g.add(acFan);
      }
    }
    // 建模优化：单元入口雨棚 + 门灯
    if (Math.random() < 0.7) {
      const awning = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.12, 0.9),
        new THREE.MeshStandardMaterial({ color: 0x2c3a4a, roughness: 0.7 }));
      awning.position.set(0, 2.3, d / 2 + 0.3); g.add(awning);
      const doorGlow = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.5),
        new THREE.MeshBasicMaterial({ color: 0xffe0b0, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false }));

  // ---- 临街商店 ----

    const floors = 1 + (Math.random() < 0.6 ? 1 : 0);
    const h = floors * 3.2 + 0.4;
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(d, h, w),
      floors > 1 ? buildingMaterial('warm', seed) : darkMat.clone());
    body.position.y = h / 2;
    g.add(body);
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(w * 0.92, 0.9),
      new THREE.MeshBasicMaterial({ map: signTexture(SHOP_NAMES[seed % SHOP_NAMES.length], SIGN_COLORS[seed % SIGN_COLORS.length]), transparent: true })
    );
    sign.position.set(0, 2.55, d / 2 + 0.05);
    g.add(sign);
    const win = new THREE.Mesh(
      new THREE.PlaneGeometry(w * 0.86, 1.7),

    );

      awningGlow.position.set(0, 1.4, d / 2 + 0.42);

  // ---- 塔楼 ----
  function makeTower(x, z, w, h, d, kind, seed) {
    if (h > 20 && Math.random() < 0.65) {
      const pw = w * (1.35 + Math.random() * 0.2);
      const pd = d * (1.35 + Math.random() * 0.2);
      const ph = 5.5 + Math.random() * 2;
      const podium = new THREE.Mesh(new THREE.BoxGeometry(pw, ph, pd), darkMat2.clone());
      podium.position.set(x, ph / 2, z);
      podium.rotation.y = (Math.random() - 0.5) * 0.1;
      scene.add(podium);
      const pband = new THREE.Mesh(new THREE.BoxGeometry(pw * 0.8, 0.1, pd * 0.8),
        new THREE.MeshStandardMaterial({ color: 0xfff0d8, emissive: 0xffc070, emissiveIntensity: 1.2 }));
      pband.position.set(x, ph + 0.05, z);
      pband.rotation.y = podium.rotation.y;
      scene.add(pband);
    }
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMaterial(kind, seed));
    body.position.set(x, h / 2, z);
    body.rotation.y = (Math.random() - 0.5) * 0.08;
    scene.add(body);
    // 建模优化：建筑 LED 竖条（赛博立面灯条，高楼才有）
    if (h > 12 && Math.random() < 0.8) {
      const stripColor = [0x00e5ff, 0xff2d95, 0x7c4dff, 0x00ffa3][seed % 4];
      const stripMat = new THREE.MeshBasicMaterial({ color: stripColor, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
      const nStrips = 2 + (Math.random() * 3 | 0);
      const edge = Math.random() < 0.5 ? w / 2 + 0.08 : -w / 2 - 0.08;
      for (let i = 0; i < nStrips; i++) {
        const strip = new THREE.Mesh(new THREE.BoxGeometry(0.12, h * 0.82, 0.08), stripMat);
        strip.position.set(x + edge, h * 0.5, z - d * 0.35 + i * (d * 0.7 / Math.max(1, nStrips - 1)));
        strip.rotation.y = body.rotation.y;
        scene.add(strip);
        // 竖条顶端小亮块（呼吸灯）
        const tip = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.18, 0.12), stripMat.clone());
        tip.position.set(x + edge, h * 0.92, z - d * 0.35 + i * (d * 0.7 / Math.max(1, nStrips - 1)));
        tip.rotation.y = body.rotation.y;
        scene.add(tip);
        ledStrips.push({ mesh: strip, tip, base: 0.4 + Math.random() * 0.5, phase: Math.random() * Math.PI * 2 });
      }
    }
    const cap = new THREE.Mesh(new THREE.BoxGeometry(w * 0.58, 2.6, d * 0.58), darkMat2);
    cap.position.set(x, h + 1.3, z);
    cap.rotation.y = body.rotation.y;
    scene.add(cap);
    if (Math.random() < 0.5) {
      const room = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), darkMat2);
      room.position.set(x + 0.6, h + 2.6, z + 0.6);
      scene.add(room);
    }
    // 建模优化：高塔直升机停机坪圆环（反光警示）
    if (h > 22 && Math.random() < 0.45) {
      const padRing = new THREE.Mesh(new THREE.CircleGeometry(w * 0.42, 24),
        new THREE.MeshStandardMaterial({ color: 0x263240, roughness: 0.35, metalness: 0.5 }));
      padRing.rotation.x = -Math.PI / 2;
      padRing.position.set(x, h + 2.85, z);
      padRing.rotation.z = body.rotation.y;
      scene.add(padRing);
      const padEdge = new THREE.Mesh(new THREE.RingGeometry(w * 0.36, w * 0.42, 24),
        new THREE.MeshBasicMaterial({ color: 0xff5533, transparent: true, opacity: 0.8, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
      padEdge.rotation.x = -Math.PI / 2;
      padEdge.position.set(x, h + 2.88, z);
      padEdge.rotation.z = body.rotation.y;
      scene.add(padEdge);
      const padH = new THREE.Mesh(new THREE.RingGeometry(w * 0.12, w * 0.16, 24),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
      padH.rotation.x = -Math.PI / 2;
      padH.position.set(x, h + 2.89, z);
      padH.rotation.z = body.rotation.y;
      scene.add(padH);
    }
    // 建模优化：楼顶通讯天线塔（细长）
    if (Math.random() < 0.3) {
      const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.06, 3.2, 5), poleMat);
      mast.position.set(x - 0.6, h + 3.6, z - 0.6);
      scene.add(mast);
      const blinker = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 6), redEmissiveMat);
      blinker.position.set(x - 0.6, h + 5.3, z - 0.6);
      scene.add(blinker);
      roofLights.push({ mesh: blinker, phase: Math.random() * Math.PI * 2 });
    }
    // 建模优化：塔楼横向窗台灯带（低概率，顶部与中段各一条）
    if (Math.random() < 0.5) {
      const bandMat = new THREE.MeshBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false });
      for (const by of [h * 0.3, h * 0.7]) {
        const b2 = new THREE.Mesh(new THREE.BoxGeometry(w * 1.02, 0.12, d * 1.02), bandMat);
        b2.position.set(x, by, z);
        b2.rotation.y = body.rotation.y;
        scene.add(b2);
      }
    }
    if (Math.random() < 0.35) {
      const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.8, 4), poleMat);
      ant.position.set(x - 0.5, h + 3.2, z - 0.5);
      scene.add(ant);
    }
    if (h > 14 && Math.random() < 0.6) {
      const lm = new THREE.MeshStandardMaterial({ color: 0xff2020, emissive: 0xff0000, emissiveIntensity: 1.0 });
      const light = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), lm);
      light.position.set(x, h + 0.6, z);
      scene.add(light);
      roofLights.push({ mesh: light, phase: Math.random() * Math.PI * 2 });
    }
    if (Math.random() < 0.42 && h > 14) {
      makeRoofBoard(x, h + 3.2, z, Math.random() * Math.PI * 2,
        3 + Math.random() * 2.5, 1.5 + Math.random() * 0.8,
        ROOF_BOARD_TEXTS[(seed + 2) % ROOF_BOARD_TEXTS.length], SIGN_COLORS[(seed + 3) % SIGN_COLORS.length]);
    }
    return body;
  }

  // ---- 巨型广告屏 ----
  function makeBillboard(x, y, z, rotY, w, h, seed) {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#0a0e14';
    ctx.fillRect(0, 0, 256, 128);
    const texts = ['SHIBUYA', '109', 'SHIBUYA', 'STYLE', 'TOKYO', 'CROSSING'];
    ctx.font = 'bold 54px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(texts[seed % texts.length], 128, 64);
    const mat = new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(c), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    mesh.position.set(x, y, z);
    mesh.rotation.y = rotY;
    scene.add(mesh);
    billboards.push({ mesh, phase: seed * 0.37, speed: 0.045 + (seed % 3) * 0.02 });
    return mesh;
  }

  // ---- 全息广告屏 ----
  function makeHoloBillboard(x, y, z, rotY, w, h, seed) {
    const g = new THREE.Group();
    // 扫描线背景
    const c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    const ctx = c.getContext('2d');
    ctx.fillStyle = 'rgba(5,10,20,0.15)';
    ctx.fillRect(0, 0, 256, 128);
    // 网格线
    ctx.strokeStyle = 'rgba(0,255,255,0.25)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      ctx.beginPath(); ctx.moveTo(0, i * 16); ctx.lineTo(256, i * 16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(i * 32, 0); ctx.lineTo(i * 32, 128); ctx.stroke();
    }
    // 文字
    const texts = ['NEO-TOKYO', 'CYBER', 'SHIBUYA', 'FUTURE', 'AI-CITY', 'DATA'];
    ctx.font = 'bold 42px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#00ffff';
    ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 12;
    ctx.fillText(texts[seed % texts.length], 128, 64);
    const mat = new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(c), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    g.add(mesh);
    // 边框光
    const edgeGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, h));
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
    g.add(new THREE.LineSegments(edgeGeo, edgeMat));
    g.position.set(x, y, z);
    g.rotation.y = rotY;
    scene.add(g);
    billboards.push({ mesh, phase: seed * 0.37, speed: 0.045 + (seed % 3) * 0.02 });
    return g;
  }

        color: i % 2 === 0 ? 0x00ffff : 0xff00ff,

        color: i % 2 === 0 ? 0x00ffff : 0xff00ff,

      });
      const glow = new THREE.Mesh(
        new THREE.CylinderGeometry(r + 0.3, r + 0.3, 0.6, 20, 1, true), glowMat
      );
      glow.position.y = 1.5 + i * 2.2;

    const top = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 2.2),
      new THREE.MeshBasicMaterial({ map: signTexture('109', '#00ffff'), transparent: true }));
    top.position.set(0, 20.8, 5.9);
    g.add(top);
    // 侧面LED屏
    for (let i = 0; i < 3; i++) {

    g.position.set(x, 0, z);

  // ============================================================
  //  中央涩谷十字区
  // ============================================================
  function buildShibuyaCore() {
    coreCorners = [
      { x: -11.5, z: 11.5, w: 11, d: 11, h: 34, seed: 5, screenW: 8.5, screenH: 5.5, sy: 21 },
      { x: 12.5,  z: 11.0, w: 10, d: 11, h: 30, seed: 8, screenW: 8,   screenH: 5,   sy: 19 },
      { x: -12.0, z: -12.0, w: 10, d: 10, h: 38, seed: 13, screenW: 8.5, screenH: 6, sy: 24 },
      { x: 13.0,  z: -12.5, w: 11, d: 10, h: 32, seed: 21, screenW: 8,   screenH: 5.5, sy: 20 },
    ];
    coreCorners.forEach((c, i) => {
      makeTower(c.x, c.z, c.w, c.h, c.d, i % 2 ? 'warm' : 'cool', c.seed);
      const ang = Math.atan2(-c.x, -c.z);
      makeHoloBillboard(c.x, c.sy, c.z, ang, c.screenW, c.screenH, i + 2);
    });
    make109(13.5, 13.8, Math.PI * 0.75);
    const lowScreens = [
      { x: -8.5, y: 5.2, z: 9.0, ang: Math.PI * 0.25, w: 4.5, h: 2.6 },
      { x: 9.0,  y: 5.0, z: -8.5, ang: Math.PI * 1.25, w: 4.5, h: 2.6 },
    ];
    lowScreens.forEach((s, i) => makeHoloBillboard(s.x, s.y, s.z, s.ang, s.w, s.h, i + 6));
    // 十字四角商店 + 便利店 + 贩卖机
    for (let i = 0; i < 4; i++) {
      const sz = [18, 6, -18, -34][i];
      makeShop(-6.6, sz, 1, 30 + i);
      makeShop(6.6, sz, -1, 40 + i);
    }
    for (let i = 0; i < 3; i++) {
      const sx = [-4, 4, -10][i];
      makeShop(sx, -16.5, sx < 0 ? 1 : -1, 50 + i);
      makeShop(sx, -9.5, sx < 0 ? -1 : 1, 60 + i);
    }
    makeConvenience(-8.2, 5.5, Math.PI * 0.9);
    makeConvenience(8.4, -4.8, Math.PI * -0.3);
    makeVending(-6.2, 1.8, 0.3, 0xff5533, 0xffffff);
    makeVending(6.4, 3.2, -0.5, 0x33aaff, 0xffffff);
    makeVending(-6.6, -2.4, 0.8, 0xffcc00, 0xff5533);
    makeVending(6.2, -1.6, -0.2, 0x66ccff, 0xff88cc);
    makeVending(-4.2, -13.6, 1.2, 0x88ffcc, 0xffffff);
    makeVending(4.6, -12.8, -1.1, 0xffaa33, 0xffffff);
    makeTree(-8.5, 6.5);
    makeTree(8.5, -6.5);
    makeTree(-8.5, -20);
    makeTree(8.5, 22);
    makeRoadSign(-7.6, 3.5, Math.PI * 0.25);
    makeRoadSign(7.8, -3.0, -Math.PI * 0.6);
  }

  // ============================================================
  //  街区生成 —— 大幅扩容
  // ============================================================
  const pedestrianLights = [];
  function buildCity() {
    buildShibuyaCore();
    const seed = { n: 100 };
    const R = () => (seed.n = (seed.n * 16807) % 2147483647, seed.n / 2147483647);

    // 主路两侧：商店/便利店/加油站 连续商业带
    for (let zc = 30; zc > -310; zc -= 14) {
      if (Math.abs(zc) < 8 || Math.abs(zc - 18) < 6 || Math.abs(zc + 18) < 6) continue;
      const side = ((zc / 14) | 0) % 2;
      if (side === 0) {
        if (R() < 0.62) makeShop((R() < 0.5 ? -1 : 1) * 6.6, zc, R() < 0.5 ? 1 : -1, 200 + (zc | 0));
        if (R() < 0.25) makeConvenience((R() < 0.5 ? -1 : 1) * 6.8, zc, (Math.random() - 0.5) * 1.2);
        if (R() < 0.14) makeVending((R() < 0.5 ? -1 : 1) * 6.3, zc, (Math.random() - 0.5) * 2, 0xff5533, 0xffffff);
      } else {
        if (R() < 0.5) makeApartment((R() < 0.5 ? -1 : 1) * 6.8, zc, (Math.random() - 0.5) * 0.6);
        if (R() < 0.2) makeSmallHouse((R() < 0.5 ? -1 : 1) * 6.9, zc, (Math.random() - 0.5) * 0.6);
      }
    }
    // 辅路两侧
    for (let zc = 40; zc > -180; zc -= 16) {
      if (Math.abs(zc) < 10) continue;
      if (R() < 0.55) makeApartment((R() < 0.5 ? -1 : 1) * 20.8, zc, (Math.random() - 0.5) * 0.5);
      if (R() < 0.3) makeShop((R() < 0.5 ? -1 : 1) * 20.9, zc, R() < 0.5 ? 1 : -1, 400 + (zc | 0));
      if (R() < 0.12) makeVending((R() < 0.5 ? -1 : 1) * 20.4, zc, (Math.random() - 0.5) * 2, 0x66ffaa, 0xffffff);
    }
    // 建模优化：主路人行道霓虹地灯带（发光地砖，随雨夜更亮）
    const edgeX = [5.2, -5.2];
    for (const ex of edgeX) {
      for (let zc = 26; zc > -300; zc -= 3.5) {
        const strip = new THREE.Mesh(
          new THREE.BoxGeometry(0.16, 0.02, 2.6),
          new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        strip.position.set(ex, 0.015, zc);
        scene.add(strip);
      }
    }
    // 建模优化：十字路口地面光斑（斑马线区域微光）
    for (let zc = 0; zc > -135; zc -= 45) {
      for (const ex of [-10.4, 10.4, -2.6, 2.6]) {
        const mark = new THREE.Mesh(
          new THREE.CircleGeometry(1.3, 12),
          new THREE.MeshBasicMaterial({ color: 0x66ccff, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        mark.rotation.x = -Math.PI / 2;
        mark.position.set(ex, 0.02, zc);
        scene.add(mark);
      }
    }
    // 全息广告屏沿街分布
    for (let z = 40; z > -180; z -= 28) {
      makeHoloBillboard(7, 8 + Math.random() * 4, z, Math.PI * 0.5, 4, 2.5, 1000 + z);
      makeHoloBillboard(-7, 8 + Math.random() * 4, z, -Math.PI * 0.5, 4, 2.5, 2000 + z);
    }
    // 涩谷风格垂直霓虹灯牌
    const neonSignTexts = [
      'GAMES', 'HOTEL', 'PACHINKO', 'MANGA', 'DIGITAL', 'LIVE',
      'KARAOKE', '24H', 'PHOTO', 'SQUARE', 'STYLE', 'CITY',
      'SHIBUYA', 'ARCADE', 'WIFI', 'OPEN', 'BAR', 'CLUB'
    ];
    for (let z = 35; z > -175; z -= 10) {
      if (Math.random() < 0.5) {
        const side = Math.random() < 0.5 ? -1 : 1;
        const signH = 2.5 + Math.random() * 3;
        const signW = 1.2 + Math.random() * 0.8;
        const txt = neonSignTexts[Math.floor(Math.random() * neonSignTexts.length)];
        const neonColor = [0x00ffff, 0xff00ff, 0x00aaff, 0xffaa00, 0xff4488, 0x44ff88][Math.floor(Math.random() * 6)];
        const g = new THREE.Group();
        const bg = new THREE.Mesh(
          new THREE.BoxGeometry(signW, signH, 0.15),
          new THREE.MeshBasicMaterial({
            color: 0x0a0e18, transparent: true, opacity: 0.9
          })
        );
        g.add(bg);
        const face = new THREE.Mesh(
          new THREE.PlaneGeometry(signW * 0.85, signH * 0.85),
          new THREE.MeshBasicMaterial({
            color: neonColor, transparent: true,
            blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.9,
            map: new THREE.CanvasTexture((() => {
              const cv = document.createElement('canvas');
              cv.width = 128; cv.height = 256;
              const ct = cv.getContext('2d');
              ct.clearRect(0, 0, 128, 256);
              ct.font = 'bold 36px sans-serif';
              ct.textAlign = 'center'; ct.textBaseline = 'middle';
              ct.fillStyle = '#' + neonColor.toString(16).padStart(6, '0');
              ct.shadowColor = '#' + neonColor.toString(16).padStart(6, '0');
              ct.shadowBlur = 18;
              // 竖排文字
              const chars = txt.split('');
              const startY = 128 - (chars.length * 36) / 2;
              for (let ci = 0; ci < chars.length; ci++) {
                ct.fillText(chars[ci], 64, startY + ci * 36);
              }
              return cv;
            })())
          })
        );
        face.position.z = 0.08;
        g.add(face);
        // 底部霓虹光管
        const tube = new THREE.Mesh(
          new THREE.CylinderGeometry(0.03, 0.03, signH + 0.3, 6),
          new THREE.MeshBasicMaterial({
            color: neonColor, transparent: true,
            blending: THREE.AdditiveBlending, depthWrite: false
          })
        );
        tube.position.set(side > 0 ? -signW * 0.5 - 0.1 : signW * 0.5 + 0.1, 0, 0.1);
        g.add(tube);
        const nLight = new THREE.PointLight(neonColor, 0.6, 14, 2);
        nLight.position.set(side * 0.3, 0, 0.5);
        g.add(nLight);
        g.position.set(side * 6.2, 3 + signH * 0.5, z);
        scene.add(g);
      }
    }
    // 加油站（辅路边两个）
    if (!isMobile) {
      makeGasStation(-24.5, 18, Math.PI * 0.5);
      makeGasStation(24.5, -58, -Math.PI * 0.5);
    }
    // 街区内部：低矮房屋/公寓 填充
    for (let zc = 40; zc > -220; zc -= 12) {
      if (Math.abs(zc) < 22) continue;
      for (const side of [-1, 1]) {
        if (R() < 0.7) {
          const x = side * (11 + R() * 6);
          const z = zc + R() * 6 - 3;
          if (R() < 0.6) makeSmallHouse(x, z, (Math.random() - 0.5) * 1.6);
          else makeApartment(x, z, (Math.random() - 0.5) * 0.8);

  function makeRainTexture() {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const ctx = c.getContext('2d');
    // 透明水珠：外圈高光 + 内部折射 + 高光点
    ctx.clearRect(0, 0, 64, 64);
    const grad = ctx.createRadialGradient(26, 26, 0, 32, 32, 30);
    grad.addColorStop(0, 'rgba(255,255,255,0.6)');
    grad.addColorStop(0.15, 'rgba(200,225,255,0.55)');
    grad.addColorStop(0.4, 'rgba(150,190,230,0.35)');
    grad.addColorStop(0.7, 'rgba(120,160,210,0.18)');
    grad.addColorStop(0.9, 'rgba(100,140,190,0.08)');
    grad.addColorStop(1, 'rgba(80,120,170,0.0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(32, 32, 30, 0, Math.PI * 2); ctx.fill();
    // 左上高光点
    const hl = ctx.createRadialGradient(22, 20, 0, 22, 20, 10);
    hl.addColorStop(0, 'rgba(255,255,255,0.85)');
    hl.addColorStop(0.3, 'rgba(220,240,255,0.4)');
    hl.addColorStop(1, 'rgba(200,230,255,0.0)');
    ctx.fillStyle = hl;
    ctx.beginPath(); ctx.arc(22, 20, 10, 0, Math.PI * 2); ctx.fill();
    // 右下折射边缘
    ctx.strokeStyle = 'rgba(180,210,240,0.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(32, 32, 22, 0, Math.PI * 2); ctx.stroke();
    return new THREE.CanvasTexture(c);
  }

        musicGain.gain.value = 1.0;
        srcNode.connect(musicGain);
        musicGain.connect(audioCtx.destination);
      }
    } catch (e) { musicGain = null; }
    // 媒体会话：系统媒体栏 / 锁屏显示歌名并可控制
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.setActionHandler('play', () => { audio.play(); });
        navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); });
      } catch (e) {}
    }
    // 标签页切回前台时恢复播放（若切走前正在播放）
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        wasPlayingBeforeHide = audio && !audio.paused && !audio.ended;
      } else {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (wasPlayingBeforeHide && audio) {
          audio.play().catch(() => {});
        }
        wasPlayingBeforeHide = false;
      }
    });
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  // ---------- 搜索历史（localStorage） ----------
  const HISTORY_KEY = 'emocity_search_history';
  const FAV_KEY = 'emocity_favs';
  function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (e) { return []; } }
  function saveHistory(h) { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); } catch (e) {} }
  function addHistory(kw) {
    const h = getHistory().filter(x => x.toLowerCase() !== kw.toLowerCase());
    h.unshift(kw);
    if (h.length > 10) h.length = 10;
    saveHistory(h);
    renderHistory();
  }
  function removeHistory(kw) {
    saveHistory(getHistory().filter(x => x.toLowerCase() !== kw.toLowerCase()));
    renderHistory();
  }
  function renderHistory() {
    const h = getHistory();
    historyWrap.style.display = h.length ? 'block' : 'none';
    historyList.innerHTML = h.map(kw =>
      `<div class="h-item"><span class="h-kw">${escapeHtml(kw)}</span><span class="h-del">✕</span></div>`
    ).join('');
    historyList.querySelectorAll('.h-item').forEach(el => {
      const kw = el.querySelector('.h-kw').textContent;
      el.addEventListener('click', ev => {
        if (ev.target.classList.contains('h-del')) { removeHistory(kw); return; }
        searchInput.value = kw;
        searchMusic(kw);
      });
    });
  }
  historyClear.addEventListener('click', () => { saveHistory([]); renderHistory(); });
  renderHistory();

  // ---------- 歌曲收藏（localStorage） ----------
  function getFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch (e) { return []; } }
  function saveFavs(f) { try { localStorage.setItem(FAV_KEY, JSON.stringify(f)); } catch (e) {} }
  function isFav(song) { return getFavs().some(f => f.url === song.url); }
  function refreshFavBtn() {
    favBtn.classList.toggle('on', !!currentSong && isFav(currentSong));
    favBtn.textContent = (currentSong && isFav(currentSong)) ? '♥' : '♡';
    favListBtn.textContent = '❤️ ' + getFavs().length;
  }
  function toggleFav() {
    if (!currentSong) return;
    const f = getFavs();
    const idx = f.findIndex(x => x.url === currentSong.url);
    if (idx >= 0) f.splice(idx, 1); else f.unshift({ title: currentSong.title, author: currentSong.author, url: currentSong.url });
    saveFavs(f);
    refreshFavBtn();
    renderFavs();
  }
  function renderFavs() {
    const f = getFavs();
    favList.innerHTML = f.length ? '' : `<div class="empty">${t('favEmpty')}</div>`;
    f.forEach(song => {
      const el = document.createElement('div');
      el.className = 'f-item';
      el.innerHTML = `<span class="t">${escapeHtml(song.title)}</span><span class="a">${escapeHtml(song.author)}</span><span class="f-del">✕</span>`;
      el.addEventListener('click', ev => {
        if (ev.target.classList.contains('f-del')) {
          const nf = getFavs().filter(x => x.url !== song.url);
          saveFavs(nf); refreshFavBtn(); renderFavs(); return;
        }
        playSong(song);
        favPanel.classList.remove('open');
      });
      favList.appendChild(el);
    });
  }
  favBtn.addEventListener('click', toggleFav);
  favListBtn.addEventListener('click', () => {
    favPanel.classList.toggle('open');
    renderFavs();
  });
  favClose.addEventListener('click', () => favPanel.classList.remove('open'));
  refreshFavBtn();
  renderFavs();

  async function searchMusic(keyword) {
    resultList.style.display = 'block';
    resultList.innerHTML = `<div class="empty">${t('searching')}</div>`;
    searchBtn.disabled = true;
    try {
      const res = await fetch(`${METING}?server=netease&type=search&id=${encodeURIComponent(keyword)}`);
      if (!res.ok) throw new Error('network');
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) {
        resultList.innerHTML = `<div class="empty">${t('noResults')}</div>`;
        return;
      }
      resultList.innerHTML = '';
      const seen = new Set();
      let count = 0;
      for (const s of data) {
        if (!s.url) continue;
        const key = s.title + '|' + s.author;
        if (seen.has(key)) continue;
        seen.add(key);
        if (++count > 15) break;
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `<div class="t">${escapeHtml(s.title)}</div><div class="a">${escapeHtml(s.author)}</div>`;
        item.addEventListener('click', () => playSong(s));
        resultList.appendChild(item);
      }
      if (!resultList.children.length) resultList.innerHTML = `<div class="empty">${t('noPlayable')}</div>`;
      addHistory(keyword);
    } catch (e) {
      resultList.innerHTML = `<div class="empty">${t('searchFailed')}</div>`;
    } finally {
      searchBtn.disabled = false;
    }
  }
  function playSong(song) {
    ensureMusicAudio();
    if (audio) { audio.pause(); audio.src = ''; }
    currentSong = song;
    audio.src = song.url;
    npTitle.textContent = song.title;
    npArtist.textContent = song.author;
    nowPlaying.style.display = 'flex';
    playPause.textContent = '⏸';
    refreshFavBtn();
    if (musicGain) musicGain.gain.value = 1.0;
    audio.play().catch(() => {
      npTitle.textContent = t('playFailed');
      npArtist.textContent = t('tryAnother');
    });
    // 系统媒体控制信息
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.title,
          artist: song.author,
          album: 'EmoCity · Neo-Shibuya',
        });
      } catch (e) {}
    }
    audio.addEventListener('ended', () => { playPause.textContent = '▶'; });
    audio.addEventListener('error', () => {
      npTitle.textContent = t('playFailed');
      npArtist.textContent = t('tryAnother');
    });
  }
  playPause.addEventListener('click', () => {
    if (!audio) return;
    if (audio.paused) { audio.play(); playPause.textContent = '⏸'; }
    else { audio.pause(); playPause.textContent = '▶'; }
  });
  searchBtn.addEventListener('click', () => {
    const kw = searchInput.value.trim();
    if (kw) searchMusic(kw);
  });
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const kw = searchInput.value.trim();
      if (kw) searchMusic(kw);
    }
  });
  searchInput.addEventListener('focus', () => { renderHistory(); });

  function stripTags(s) { return String(s || '').replace(/<[^>]*>/g, ''); }

  async function lookupEn(word) {
    dictBody.innerHTML = `<div class="not-found">${t('dictLoading')}</div>`;
    try {
      const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word));
      if (!res.ok) throw new Error('nf');
      const data = await res.json();
      const entry = Array.isArray(data) ? data[0] : data;
      let html = `<div class="word-big">${escapeHtml(entry.word)}</div>`;
      const ph = entry.phonetic || (entry.phonetics || []).map(p => p.text).filter(Boolean)[0];
      if (ph) html += `<div class="word-phon">/${stripTags(ph)}/</div>`;
      const srcs = (entry.phonetics || []).map(p => p.audio).filter(Boolean);
      if (srcs.length) html += `<button class="dict-tab" style="margin-bottom:6px;" onclick="(new Audio('${srcs[0].replace(/'/g,"\\'")}')).play()">🔊</button>`;
      html += `<div class="word-badges">`;
      const tags = (entry.origin ? `<span class="badge">${escapeHtml(entry.origin)}</span>` : '');
      if (tags) html += tags;
      html += `</div>`;
      for (const m of (entry.meanings || [])) {
        html += `<div class="pos">${escapeHtml(m.partOfSpeech)}</div>`;
        for (const d of m.definitions || []) {
          html += `<div class="def">• ${escapeHtml(stripTags(d.definition))}</div>`;
          if (d.example) html += `<div class="ex">“${escapeHtml(stripTags(d.example))}”</div>`;
        }
      }
      dictBody.innerHTML = html;
    } catch (e) {
      dictBody.innerHTML = `<div class="not-found">${t('dictNotFound')} · ${escapeHtml(word)}</div>`;
    }
  }

  function lookupZh(q) {
    const chars = Array.from(String(q || '').trim());
    let html = '';
    for (const ch of chars) {
      let info = HANZI[ch];
      let shown = ch;
      if (!info && TRAD_MAP[ch]) { shown = TRAD_MAP[ch] + ' (簡: ' + TRAD_MAP[ch] + ')'; info = HANZI[TRAD_MAP[ch]]; }
      if (!info) { html += `<div class="word-big">${escapeHtml(ch)}</div><div class="not-found">${t('zhNotFound')}</div>`; continue; }
      html += `<div class="word-big">${escapeHtml(ch)}${shown !== ch ? ' → ' + escapeHtml(shown) : ''}</div>`;
      const pys = (info.p || []).join(' / ');
      html += `<div class="zhi">`;
      if (pys) html += `<span class="badge">${t('pinyin')}: ${escapeHtml(pys)}</span>`;
      if (info.s) html += `<span class="badge">${t('stroke')}: ${info.s}</span>`;
      if (info.r) html += `<span class="badge">${t('radical')}: ${escapeHtml(info.r)}</span>`;
      html += `</div>`;
      const defs = info.d || [];
      for (let i = 0; i < defs.length; i++) {
        const dd = (defs[i] || []).filter(Boolean);
        if (!dd.length) continue;
        const py = (info.p && info.p[i]) ? `<span style="color:#9fc4ff">[${escapeHtml(info.p[i])}]</span> ` : '';
        html += `<div class="zh-def">${py}${dd.map(escapeHtml).join('；')}</div>`;
      }
    }
    dictBody.innerHTML = html || `<div class="not-found">${t('zhNotFound')}</div>`;
  }

  function doLookup() {
    const q = dictInput.value.trim();
    if (!q) return;
    if (dictMode === 'en') lookupEn(q);
    else lookupZh(q);
  }

  scene.add(snowPoints);

  function updateSnow(dt, t) {
    if (!snowPoints.visible) return;
    for (let i = 0; i < SNOW_POOL; i++) {
      snowPos[i*3+1] -= snowVel[i] * dt;
      snowPos[i*3] += Math.sin(t * 0.7 + snowPhase[i]) * 1.4 * dt; // 摇摆飘落
      if (snowPos[i*3+1] < 0) {
        snowPos[i*3]   = (Math.random() - 0.5) * rainAreaX * 2;
        snowPos[i*3+1] = 28 + Math.random() * 4;
        snowPos[i*3+2] = (Math.random() - 0.5) * rainAreaZ;
      }
    }
    snowGeo.attributes.position.needsUpdate = true;
  }

  function makeLightningBolt() {
    // 从云层到地面的一根分叉闪电（LineSegments）
    const pts = [];
    let x = (Math.random() - 0.5) * 30, y = 34, z = -40 - Math.random() * 60;
    const xDir = (Math.random() - 0.5) * 0.8;
    pts.push(x, y, z);
    const segCount = 7 + Math.floor(Math.random() * 4);
    for (let i = 1; i <= segCount; i++) {
      const t = i / segCount;
      x += xDir + (Math.random() - 0.5) * 2.4;
      y = 34 - t * 34;
      z += (Math.random() - 0.5) * 1.2;
      pts.push(x, y, z);
      pts.push(x, y, z);
      // 分叉
      if (Math.random() < 0.3) {
        pts.push(x, y, z);
        pts.push(x + (Math.random() - 0.5) * 4, y - 2 - Math.random() * 3, z + (Math.random() - 0.5) * 2);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    const mat = new THREE.LineBasicMaterial({
      color: 0xdceeff, transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const line = new THREE.LineSegments(geo, mat);
    line.visible = false;
    scene.add(line);
    return line;
  }
  function triggerLightning() {
    lightningFlash = Math.max(lightningFlash, 0.75 + Math.random() * 0.25);
    if (!lightningBolt) lightningBolt = makeLightningBolt();
    if (lightningBolt) {
      lightningBolt.visible = true;
      lightningBolt.position.x = (Math.random() - 0.5) * 10;
      lightningBolt.position.z = (Math.random() - 0.5) * 4;
      lightningBolt.material.opacity = 1;
      // 重生成分叉
      const old = lightningBolt;
      lightningBolt = makeLightningBolt();
      scene.remove(old);
      old.geometry.dispose(); old.material.dispose();
    }
    // 雷声延迟（光速快于音速：闪光后 0.5~1.8s 响雷）
    if (__thunderPlayer && audioCtx) {
      const delay = 0.5 + Math.random() * 1.3;
      setTimeout(() => {
        if (__thunderPlayer && audioCtx) __thunderPlayer.play(Math.random() * 0.6);
      }, delay * 1000);
    }
  }
  function setWeather(mode, instant) {
    weatherMode = mode;
    const p = WEATHER_PRESETS[mode];
    applyRain(p.level);
    snowPoints.visible = !!p.snow; // 雪天启用雪花
    // 雨量滑块同步
    if (rainSlider) {
      rainSlider.value = Math.round(p.level * 100);
      if (rainValue) rainValue.textContent = rainSlider.value + '%';
    }
    updateRainAudio(p.level, instant);
    // 天空渐变
    const idx = p.lightIdx;
    skyMat.uniforms.uTop.value.setHex(SKY_TOP[idx]);
    skyMat.uniforms.uHorizon.value.setHex(SKY_HOR[idx]);
    skyMat.uniforms.uCityGlow.value.setHex(SKY_GLOW[idx]);
    scene.fog.color.setHex(FOG_COLORS[idx]);
    scene.fog.density = p.fogD;
    // 云加速/加密
    const spdMul = p.windMul;
    clouds.forEach((c, i) => {
      c.userData.speed = CLOUD_SPEEDS[idx] * (i === 0 ? 1 : i === 1 ? 0.72 : 0.5) * 0.9;
      c.material.opacity = p.cloudOp;
    });
    // 灯牌按钮状态
    document.querySelectorAll('#weatherPanel .wbtn').forEach(b => {
      b.classList.toggle('active', b.dataset.weather === mode);
    });
  }

  // 天气按钮绑定
  document.querySelectorAll('#weatherPanel .wbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      bootAudio();
      setWeather(btn.dataset.weather, false);
    });
  });

  // ============================================================
  //  生成城市
  // ============================================================
  buildCity();

  // ============================================================
  //  主循环
  // ============================================================
  const clock = new THREE.Clock();
  let lastSpawn = 0;
  const BRAND_COLORS = [0xff5533, 0x33aaff, 0xffcc00, 0x35e0b0, 0xff66cc, 0xffffff];
  const tmpColor = new THREE.Color();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    controls.update();

    updateSnow(dt, t);

    const wind = 1.5 + rainLevel * 3.8;
    for (let i = 0; i < targetCount; i++) {
      rainPos[i*3+1] -= rainVel[i] * dt;
      rainPos[i*3] += wind * dt;
      if (rainPos[i*3+1] < 0) {
        const x = rainPos[i*3];
        const z = rainPos[i*3+2];
        if (Math.abs(x) < 25 && Math.abs(z) < 100 && t - lastSpawn > (0.022 / (0.35 + rainLevel))) {
          spawnRipple(x, z, 0.6 + Math.random() * 0.7);
          if (Math.random() < 0.4 + rainLevel * 0.35) spawnSplash(x, z);
          lastSpawn = t;
        }
        rainPos[i*3]   = (Math.random() - 0.5) * rainAreaX * 2;
        rainPos[i*3+1] = 26 + Math.random() * 4;
        rainPos[i*3+2] = (Math.random() - 0.5) * rainAreaZ;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;

    // 高速雨丝
    const streakTarget = Math.floor(STREAK_POOL * (0.02 + Math.min(rainLevel, 1.7) / 1.7 * 0.98));
    streakGeo.setDrawRange(0, streakTarget);
    for (let i = 0; i < streakTarget; i++) {
      streakPos[i*3+1] -= streakVel[i] * dt;
      streakPos[i*3] += wind * 1.3 * dt;
      if (streakPos[i*3+1] < 0) {
        streakPos[i*3]   = (Math.random() - 0.5) * rainAreaX * 2;
        streakPos[i*3+1] = 26 + Math.random() * 4;
        streakPos[i*3+2] = (Math.random() - 0.5) * rainAreaZ;
      }
    }
    streakGeo.attributes.position.needsUpdate = true;

    for (let i = 0; i < MIST_POOL; i++) {
      mistPos[i*3+1] -= mistVel[i] * dt;
      mistPos[i*3] += wind * 0.8 * dt;
      if (mistPos[i*3+1] < 0) {
        mistPos[i*3]   = (Math.random() - 0.5) * 80;
        mistPos[i*3+1] = 28 + Math.random() * 4;
        mistPos[i*3+2] = -40 - Math.random() * 130;
      }
    }
    mistGeo.attributes.position.needsUpdate = true;

    for (let i = 0; i < SPLASH_POOL; i++) {
      if (splashLife[i] <= 0) continue;
      splashLife[i] -= dt;
      if (splashLife[i] <= 0) { splashPos[i*3+1] = -999; splashAlive--; continue; }
      splashVel[i*3+1] -= 5 * dt;
      splashPos[i*3]   += splashVel[i*3]   * dt;
      splashPos[i*3+1] += splashVel[i*3+1] * dt;
      splashPos[i*3+2] += splashVel[i*3+2] * dt;
      if (splashPos[i*3+1] < 0.02) { splashPos[i*3+1] = -999; splashLife[i] = 0; splashAlive--; }
    }
    splashGeo.setDrawRange(0, splashAlive);
    splashGeo.attributes.position.needsUpdate = true;

    for (const car of cars) {
      car.position.z += car.userData.speed * dt;
      const lim = car.userData.maxZ;
      if (car.userData.speed > 0 && car.position.z > lim) car.position.z = -lim + Math.random() * 5;
      else if (car.userData.speed < 0 && car.position.z < -lim) car.position.z = lim - Math.random() * 5;
    }

    const ph = t % TRAFFIC_PERIOD;
    const states = [false, false, false];
    if (ph < 6) states[0] = true;
    else if (ph < 7.5) states[1] = true;
    else states[2] = true;
    for (const tl of trafficLights) {
      tl.lamps.forEach((l, i) => {
        l.material.color.set(states[i] ? LAMP_COLORS[i] : 0x151515);
      });
    }
    // 行人信号灯：与主路红灯同步（红灯时行人绿灯）
    const walkGreen = !states[2];
    for (const pl of pedestrianLights) {
      pl.red.material.color.set(walkGreen ? 0x151515 : 0xff3030);
      pl.green.material.color.set(walkGreen ? 0x30e060 : 0x151515);
    }

    for (let i = 0; i < billboards.length; i++) {
      const b = billboards[i];
      const ci = Math.floor(t * b.speed + b.phase) % BRAND_COLORS.length;
      b.mesh.material.color.setHex(BRAND_COLORS[ci]);
      if (i < 4 && coreCorners[i]) {
        tmpColor.setHex(BRAND_COLORS[ci]);
        const s = groundMat.uniforms.uScreens.value[i];
        s.set(coreCorners[i].x, coreCorners[i].z, tmpColor.r, tmpColor.g, tmpColor.b);
      }
    }

    for (const rl of roofLights) {
      rl.mesh.material.emissiveIntensity = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.8 + rl.phase));
    }

    // 建模优化：LED 竖条呼吸动画
    for (const s of ledStrips) {
      const p = 0.45 + 0.55 * Math.sin(t * 2.2 + s.phase);
      s.mesh.material.opacity = 0.45 + 0.4 * p;
      s.tip.material.opacity = 0.5 + 0.5 * Math.abs(Math.sin(t * 4 + s.phase));
    }

    for (const c of clouds) {
      c.position.x += c.userData.speed * dt;
      if (c.position.x > c.userData.baseW * 0.55) c.position.x = -c.userData.baseW * 0.55;
    }

    // 闪电系统：按天气频率触发 + 闪光衰减
    if (weatherMode === 'storm' || weatherMode === 'thunder' || weatherMode === 'typhoon') {
      const freq = WEATHER_PRESETS[weatherMode].lightning;
      lightningTimer += dt;
      if (lightningTimer > lightningTarget && Math.random() < freq * dt * 3) {
        triggerLightning();
        lightningTimer = 0;
        lightningTarget = 3 + Math.random() * 4;
      }
    }
    if (lightningFlash > 0) {
      lightningFlash = Math.max(0, lightningFlash - dt * 1.6);
      skyMat.uniforms.uFlash.value = lightningFlash;
      // 场景瞬时增亮
      moon.intensity = 0.3 + lightningFlash * 1.4;
      scene.environmentIntensity = lightningFlash;
    } else {
      skyMat.uniforms.uFlash.value = 0;
    }
    if (lightningBolt) {
      if (lightningBolt.material.opacity > 0.02) {
        lightningBolt.material.opacity *= Math.pow(0.0001, dt);
      } else {
        lightningBolt.visible = false;
      }
    }

    // 无人机巡飞
    for (const d of drones) {
      d.phase += dt * d.speed * 0.12;
      const r = d.radius;
      d.mesh.position.x += Math.cos(d.phase) * d.speed * dt;
      d.mesh.position.z += Math.sin(d.phase * 0.8) * d.speed * dt;
      d.mesh.position.y = d.baseY + Math.sin(d.phase * 2.2) * 2.5;
      d.mesh.rotation.z = Math.sin(d.phase) * 0.25;
      const blinkOn = Math.sin(t * 6 + d.phase) > 0;
      d.mesh.children.forEach((ch, idx) => {
        if (idx >= 2 && idx <= 3) {
          ch.material.color.setHex(blinkOn ? (idx === 2 ? 0xff3040 : 0x30e0ff) : 0x151515);
        }
      });
      // 环绕边界
      if (d.mesh.position.x > 50) d.mesh.position.x = -50;
      if (d.mesh.position.x < -50) d.mesh.position.x = 50;
    }

    // 全息数据流上升
    const holoArr = holoGeo.attributes.position.array;
    for (let i = 0; i < HOLO_POOL; i++) {
      holoArr[i*3+1] += holoData[i*3] * dt;
      holoArr[i*3] += Math.sin(t * 1.5 + holoData[i*3+1]) * holoData[i*3+2] * dt * 8;
      if (holoArr[i*3+1] > 32) {
        holoArr[i*3]   = (Math.random() - 0.5) * 70;
        holoArr[i*3+1] = 0.2;
        holoArr[i*3+2] = -10 - Math.random() * 180;
      }
    }
    holoGeo.attributes.position.needsUpdate = true;

    groundMat.uniforms.uTime.value = t;
    renderer.render(scene, camera);
    window.__tri = renderer.info.render.triangles;
    window.__calls = renderer.info.render.calls;
    window.__frameCount = (window.__frameCount || 0) + 1;
  }
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  applyLang('en');
  </script>
</body>
